<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nexus — 文档同步</title>
<style>
  :root {
    --ink: #16181d; --ink-2: #5b616e; --line: #e6e8ec; --surface: #fff;
    --accent: #1f5fd0; --accent-ink: #fff;
    --radius-control: 6px; --radius-panel: 10px;
  }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 15px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; }
  h1 { font-size: 30px; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 24px; }
  .rows { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row p { margin: 0; }
  .row .note { color: var(--ink-2); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
  .actions { display: flex; gap: 10px; margin-top: 28px; }
  button, a.btn {
    font: inherit; height: 36px; padding: 0 16px; border-radius: var(--radius-control);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: transform 140ms ease-out, background-color 140ms ease-out;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) { button, a.btn { transition: none; } button:active { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>文档改了，三端 0.4 秒内一致</h1>

  <div class="rows">
    <div class="row">
      <p>网页、iOS、桌面共用同一份文档</p>
      <span class="num">0.4s</span>
    </div>
    <div class="row">
      <p>冲突时保留两版，逐段标出差异<span class="note"> — 不会覆盖任何一方</span></p>
      <span class="num">2 版</span>
    </div>
    <div class="row">
      <p>离线编辑在重连后自动合并</p>
      <span class="num">自动</span>
    </div>
  </div>

  <div class="actions">
    <button class="primary">打开同步日志</button>
    <button>导出差异</button>
  </div>
</main>
</body>
</html>
